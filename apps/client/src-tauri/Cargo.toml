[package]
name = "honkoku-client"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
time.workspace = true
tauri-plugin-dialog = "2"
honkoku-search = { path = "../../../crates/search" }
honkoku-ocr = { path = "../../../crates/ocr" }
tauri = { version = "=2.11.5", features = [] }
serde.workspace = true
serde_json.workspace = true
honkoku-core.workspace = true
honkoku-text.workspace = true
tokio.workspace = true
honkoku-storage.workspace = true
honkoku-iiif.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "0.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-deep-link = "=2.4.10"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "=2.4.5", features = ["deep-link"] }
